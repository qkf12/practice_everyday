<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="vue.js"></script>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            list-style:none;
        }
        #app{
            width: 420px;
            margin:30px auto;
            padding: 24px;
            background-color: #ffffff;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border-radius: 10px;
        }
        /* 页面最外层标题：全部课程 */
        #app > h3{
            font-size: 24px;
            font-weight: bold;
            color:#111;
            margin-bottom:22px;
        }
        /* 课程分类标题 */
        .v-kecheng-title{
            font-size: 19px;
            font-weight:600;
            color:#222;
            margin:18px 0 10px;
        }
        ul{
            background: #f5f7fa;
            border-radius:9px;
            padding:14px 18px;
        }
        li{
            padding:8px 0;
            border-bottom: 1px solid #e4e7ed;
        }
        li:last-child{
            border-bottom:none;
        }
        a{
            text-decoration: none;
            color:#2b5cb8;
            font-size:17px;
            display:block;
            padding:2px 4px;
            border-radius:4px;
        }
        a:hover{
            color:#c23531;
            background-color:rgba(242,92,84,0.08);
        }
    </style>
</head>
<body>
    <div id="app">
    <h3 style="text-align: center;">全部课程</h3>
    <div v-for="kecheng in course">
        <h3 class="v-kecheng-title">{{kecheng.title}}</h3>
        <ul>
            <li v-for="item in kecheng.list">
                <a :href="item.url">{{item.name}}</a>
            </li>
        </ul>
        <div v-if="!kecheng.list" class="hr"></div>
    </div>
    </div>
    <script>
        Vue.createApp({
            data(){
                return{
                    course :{
                        basic_course :{
                            title :"基础课程",
                            list :[
                                {name :"体育",url : "#"},
                                {name :"英语",url : "#"},
                                {name :"毛特",url : "#"}
                            ]
                        },
                        pro_course :{
                            title :"专业课程",
                            list :[
                                {name :"Vue",url : "#"},
                                {name :"java",url : "#"},
                                {name :"数据库",url : "#"},
                                {name :"linux",url : "#"},
                            ]
                        }
                    }
                }
            }
        }).mount("#app")
    </script>
</body>
</html>
